services:
  redis:
    image: redis:7-alpine
    container_name: pitstop-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - pitstop_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pitstop_redis_data:
