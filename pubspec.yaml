name: torq
description: "Torq — Offline-first Car Maintenance, Fuel & Expense Tracker."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  equatable: ^3.0.0
  get_it: ^9.3.0
  go_router: ^18.1.4
  drift: ^2.35.4
  drift_flutter: ^0.3.1
  sqlite3_flutter_libs: ^0.6.0+eol
  flutter_local_notifications: ^23.0.4
  timezone: ^0.11.2
  pdf: ^3.13.1
  printing: ^5.15.1
  fl_chart: ^1.3.1
  purchases_flutter: ^11.0.4
  google_mobile_ads: ^9.2.0
  intl: ^0.20.2
  image_picker: ^1.2.4
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.3
  build_runner: ^2.15.1

flutter:
  uses-material-design: true
  generate: true

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
